<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yellow Kitchen - Food Delivery</title>
  <link rel="stylesheet" href="./main.css">
</head>
<body>

  <div class="ota">
    <header class="navbar">
      <div class="logo-box">
        <img src="./image.png" alt="Yellow Kitchen Logo">
      </div>
      <div class="nav-right">
        <a href="#" class="nav-link"><img src="./image copy 6.png" alt="User"></a>
        <a href="#" class="cart-btn"><img src="./image copy 7.png" alt="Cart"></a>
        <div class="menu-icon"></div>
      </div>
    </header>

    <main class="hero-section">
      <div class="hero-content">
        <h1>Your Food court<br>at home</h1>
        <div class="hero-buttons">
          <button class="btn yellow-btn">
            <strong>Delivery</strong>
            <span>Order in</span>
          </button>
          <button class="btn outline-btn">
            <strong>Takeout</strong>
            <span>Grab and go</span>
          </button>
        </div>
      </div>

      <div class="hero-image">
        <img src="./image copy.png" alt="Fresh Salad Bowl">
      </div>
    </main>

    <section class="features-bar">
      <div class="feature-item">
        <span class="icon"><img src="./image copy 2.png" alt="Icon"></span>
        <p>delivery in all paris <br> in less than 30 minutes</p>
      </div>
      <div class="feature-item">
        <span class="icon"><img src="./image copy 3.png" alt="Icon"></span>
        <p>Free delivery <br> from 29 euros</p>
      </div>
      <div class="feature-item">
        <span class="icon"><img src="./icon-food.png" alt="Icon"></span>
        <p>Only fresh <br> and French products</p>
      </div>
    </section>

    <div class="full-banner">
      <img src="./image copy 23.png" alt="Banner">
    </div>

    <section class="nearest-section">
      <div class="nearest-content">
        <h2>Your nearest restaurants</h2>
        <p>Each kitchen works with its own delivery area to deliver food in chosen zone as possible</p>
      </div>
      <div class="search-box">
        <input type="text" placeholder="Enter delivery address">
        <button>send</button>
      </div>
    </section>

    <section class="section-block">
      <div class="section-header">
        <a href="#" class="show-all">show all</a>
      </div>
      <div class="full-banner">
        <img src="./image copy 25.png" alt="Restaurants">
      </div>
    </section>

    <div class="full-banner">
      <img src="./image copy 24.png" alt="Special Offer">
    </div>

    <section class="map-section">
      <div class="map-container">
        <img src="./image copy 21.png" alt="Delivery Map">
      </div>
    </section>

    <div class="full-banner">
      <img src="./image copy 22.png" alt="Footer Banner">
    </div>
  </div>
  <script src="./game.js"></script>
</body>
</html>
